<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Amici Sports Management | Football Player Representation</title>
  <meta name="description" content="Amici Sports Management is a football representation agency. Get in touch by email, Instagram or LinkedIn.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#210A0A">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://amicisportsgroup.com/">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Amici Sports Management">
  <meta property="og:title" content="Amici Sports Management">
  <meta property="og:description" content="Football representation agency. Get in touch.">
  <meta property="og:url" content="https://amicisportsgroup.com/">
  <meta property="og:image" content="https://amicisportsgroup.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Amici Sports Management logo: a golden letter A holding a football">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Amici Sports Management">
  <meta name="twitter:description" content="Football representation agency. Get in touch.">
  <meta name="twitter:image" content="https://amicisportsgroup.com/og-image.png">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Amici Sports Management",
    "url": "https://amicisportsgroup.com/",
    "logo": "https://amicisportsgroup.com/icon-512.png",
    "description": "Football player representation agency.",
    "email": "contact@amicisportsgroup.com",
    "sameAs": [
      "https://www.instagram.com/amicisportsgroup",
      "https://www.linkedin.com/company/amicisportsgroup"
    ]
  }
  </script>

  <link rel="preload" as="image" href="/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap">

  <style>
    :root {
      --maroon: #210A0A;      /* exact background of the logo */
      --gold-light: #F8D888;
      --gold: #C99850;
      --gold-deep: #A07030;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; background: var(--maroon); }
    body {
      margin: 0;
      min-height: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1rem, 4vh, 2.5rem);
      padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(4rem + env(safe-area-inset-bottom, 0px));
      background: var(--maroon);
      color: var(--gold);
      font-family: "Cormorant Garamond", Baskerville, Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* Logo */
    .logo { margin: 0; animation: arrive 1.4s var(--ease) both; }
    .logo img {
      display: block;
      width: min(80vw, 520px, 62svh * .923);
      height: auto;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* Contact: one pill that morphs into three round buttons */
    .contact { position: relative; width: 248px; height: 56px; }
    .contact-btn {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      width: 100%;
      border: 1px solid var(--gold);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 1.25rem;
      letter-spacing: .38em;
      text-indent: .38em;
      color: transparent;
      background-image: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
      -webkit-background-clip: text; background-clip: text;
      transition: opacity .35s var(--ease), transform .5s var(--ease), border-color .3s, box-shadow .3s;
    }
    .contact-btn:hover { border-color: var(--gold-light); box-shadow: 0 0 28px rgba(201, 152, 80, .22); }

    .contact-links {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 0; list-style: none;
      pointer-events: none;
    }
    .contact-links li { position: absolute; pointer-events: none; } /* stacked boxes must not block each other */
    .contact-links a {
      display: grid; place-items: center;
      width: 56px; height: 56px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold-light);
      background: var(--maroon);
      pointer-events: auto;
      opacity: 0; visibility: hidden;
      transform: translateX(0) scale(.4);
      transition: transform .6s var(--ease), opacity .3s, visibility 0s .6s, border-color .25s, background-color .25s, color .25s;
    }
    .contact-links a:hover { background: var(--gold); border-color: var(--gold-light); color: var(--maroon); }
    .contact-links svg { width: 22px; height: 22px; display: block; }

    /* Open: click/tap (JS), hover (mouse), or keyboard focus */
    .contact.is-open .contact-btn { opacity: 0; transform: scale(.6); pointer-events: none; }
    .contact.is-open .contact-links { pointer-events: auto; }
    .contact.is-open .contact-links a {
      opacity: 1; visibility: visible; transition-delay: 0s;
      transform: translateX(var(--x)) scale(1);
    }
    @media (hover: hover) {
      .contact:hover .contact-btn { opacity: 0; transform: scale(.6); pointer-events: none; }
      .contact:hover .contact-links { pointer-events: auto; }
      .contact:hover .contact-links a { opacity: 1; visibility: visible; transition-delay: 0s; transform: translateX(var(--x)) scale(1); }
    }
    .contact:has(:focus-visible) .contact-btn { opacity: 0; }
    .contact:has(:focus-visible) .contact-links { pointer-events: auto; }
    .contact:has(:focus-visible) .contact-links a { opacity: 1; visibility: visible; transition-delay: 0s; transform: translateX(var(--x)) scale(1); }
    .contact-links li:nth-child(1) a { --x: -80px; }
    .contact-links li:nth-child(2) a { --x: 0px; }
    .contact-links li:nth-child(3) a { --x: 80px; }

    a:focus-visible, button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 4px; }

    footer {
      position: absolute; left: 0; right: 0;
      bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
      text-align: center; font-size: .9rem; letter-spacing: .08em; color: var(--gold-deep);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    }
  </style>
  <noscript>
    <style>
      .contact-btn { display: none; }
      .contact-links a { opacity: 1; visibility: visible; transform: translateX(var(--x)); }
      .contact-links { pointer-events: auto; }
    </style>
  </noscript>
</head>
<body>
  <h1 class="sr-only">Amici Sports Management: football player representation</h1>

  <main class="logo">
    <picture>
      <source srcset="/logo.webp" type="image/webp">
      <img src="/logo.png" width="1080" height="1170" fetchpriority="high"
           alt="Amici Sports Management logo: a golden letter A holding a football, above the word AMICI">
    </picture>
  </main>

  <div class="contact" id="contact">
    <button class="contact-btn" type="button" aria-expanded="false" aria-controls="contact-links">Contact</button>
    <ul class="contact-links" id="contact-links">
      <li>
        <a href="https://www.instagram.com/amicisportsgroup" target="_blank" rel="noopener noreferrer"
           aria-label="Amici Sports Management on Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://www.linkedin.com/company/amicisportsgroup" target="_blank" rel="noopener noreferrer"
           aria-label="Amici Sports Management on LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4.98 3.5a2.5 2.5 0 1 1-.02 5 2.5 2.5 0 0 1 .02-5ZM3 9.75h4V21H3V9.75Zm6.5 0h3.8v1.6h.06c.53-1 1.82-2.05 3.75-2.05 4 0 4.74 2.63 4.74 6.05V21h-4v-4.9c0-1.17-.02-2.67-1.63-2.67-1.63 0-1.88 1.27-1.88 2.59V21h-4V9.75Z"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="mailto:contact@amicisportsgroup.com"
           aria-label="Email Amici Sports Management" title="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.8 7 8.2 6.2L20.2 7"/>
          </svg>
        </a>
      </li>
    </ul>
  </div>

  <footer>© 2026 Amici Sports Management</footer>

  <script>
    (function () {
      var box = document.getElementById('contact');
      var btn = box.querySelector('.contact-btn');
      function setOpen(open) {
        box.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      btn.addEventListener('click', function () { setOpen(!box.classList.contains('is-open')); });
      document.addEventListener('click', function (e) { if (!box.contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { setOpen(false); btn.focus(); } });
    })();
  </script>
</body>
</html>
